# -- Number of replicas. This chart targets single-pod workloads; raising this
# is supported but you are then responsible for the app tolerating concurrency.
replicaCount: 1

image:
  # -- Container image repository. Replace this placeholder with your own image.
  repository: traefik/whoami
  # -- Image tag. Defaults to `.Chart.AppVersion` when empty.
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Secrets used to pull the image, e.g. `[{name: my-regcred}]`
imagePullSecrets: []

# -- Override the chart name used in resource names
nameOverride: ""
# -- Override the fully qualified resource name
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- Mount the ServiceAccount token into the pod. Leave `false` unless the
  # app actually talks to the Kubernetes API.
  automount: false
  # -- Annotations for the ServiceAccount (e.g. IRSA / Workload Identity)
  annotations: {}
  # -- Name of the ServiceAccount. Generated from the fullname when empty.
  name: ""

# -- Extra annotations for the pod
podAnnotations: {}
# -- Extra labels for the pod
podLabels: {}

# -- Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# -- Override the image entrypoint
command: []
# -- Arguments passed to the container
args:
  - --port=8080

# -- Port the container listens on
containerPort: 8080

# -- Environment variables, in plain Kubernetes `EnvVar` form
env: []
# -- ConfigMaps / Secrets to load wholesale as environment variables
envFrom: []

# -- Extra volumes for the pod
volumes: []
# -- Extra volume mounts for the container
volumeMounts: []

# -- Resource requests and limits. A CPU limit is deliberately omitted: CPU
# throttling degrades latency without protecting the node the way a memory
# limit does.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# -- Liveness probe. Set to `{}` to disable.
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Readiness probe. Set to `{}` to disable.
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5

# -- Startup probe. Set to `{}` to disable.
startupProbe: {}

service:
  # -- Create a Service for the pod
  enabled: true
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 80
  # -- Extra annotations for the Service
  annotations: {}

ingress:
  # -- Create an Ingress for the Service
  enabled: false
  # -- IngressClass name
  className: ""
  # -- Extra annotations for the Ingress
  annotations: {}
  # -- Hosts and paths, e.g. `[{host: app.example.com, paths: [{path: /, pathType: Prefix}]}]`
  hosts: []
  # -- TLS configuration, in plain Kubernetes `IngressTLS` form
  tls: []

# -- Deployment update strategy. `Recreate` is a common choice for single-pod
# apps that cannot run two instances at once.
strategy: {}

# -- Grace period before the pod is killed
terminationGracePeriodSeconds: 30

# -- Node labels for pod assignment
nodeSelector: {}
# -- Tolerations for pod assignment
tolerations: []
# -- Affinity rules for pod assignment
affinity: {}
