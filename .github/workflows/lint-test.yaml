name: Lint and Test Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "ct.yaml"
      - "scripts/**"
      - ".github/workflows/lint-test.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # chart-testing is not yet validated against Helm 4; pin the Helm 3 line here
  # and bump it in one place. Drop the pin once ct supports Helm 4.
  HELM_VERSION: v3.19.0
  HELM_DOCS_VERSION: v1.14.2

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # ct diffs against the target branch, so it needs full history.
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: helm/chart-testing-action@v2.8.0

      - name: List changed charts
        id: list-changed
        run: |
          changed="$(ct list-changed --config ct.yaml)"
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed charts:"; echo "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No chart changes detected."
          fi

      # Also enforces the Chart.yaml version bump that chart-releaser requires
      # on merge (check-version-increment in ct.yaml).
      - name: Lint charts
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml

  docs:
    name: Docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install helm-docs
        run: |
          curl -sSLf -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs

      - name: Regenerate and diff
        run: |
          helm-docs --chart-search-root=charts --sort-values-order=file
          if ! git diff --exit-code -- charts; then
            echo "::error::Chart READMEs are stale. Run 'make docs' and commit the result."
            exit 1
          fi

  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (see Chart.yaml kubeVersion) and current.
        k8s: ["1.27.16", "1.31.4", "1.34.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSLf -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate rendered manifests
        run: ./scripts/kubeconform.sh ${{ matrix.k8s }}

  install:
    name: Install on kind
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        # kind node images; keep roughly in step with the kubeconform matrix.
        node: ["v1.31.4", "v1.34.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: helm/chart-testing-action@v2.8.0

      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:${{ matrix.node }}

      # Runs `helm install` + `helm test` for the chart defaults and for every
      # charts/*/ci/*-values.yaml file, each in a throwaway namespace.
      - name: Install charts
        run: ct install --config ct.yaml
